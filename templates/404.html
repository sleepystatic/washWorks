{% extends "base.html" %}

{% block content %}
<section class="error-page container">
  <p class="error-page__code">404</p>
  <h1>We couldn&rsquo;t find that page.</h1>
  <p class="lede" style="margin-top:var(--s-4)">It may have moved, or the link may be out of date.
     Here is the way back.</p>
  <div class="btn-row">
    <a class="btn btn--primary" href="{{ url_for('index') }}">Home</a>
    <a class="btn btn--outline" href="{{ url_for('services') }}">Services</a>
    <a class="btn btn--outline" href="tel:{{ company.phone_href }}">{{ company.phone_display }}</a>
  </div>
</section>
{% endblock %}
