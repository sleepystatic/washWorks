# Render blueprint. Valid YAML this time, and authoritative - the env keys here
# match what app.py actually reads. Secrets are set in the Render dashboard, not
# committed (sync: false).
services:
  - type: web
    name: wash-works
    runtime: python
    plan: starter          # T-1: NOT free. The free tier sleeps after 15 min idle
                           # and wakes in ~50s, so the first buyer of the day waits.
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT; gunicorn must bind it or the health check never passes.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Contact-form email via Resend. Plain HTTPS on port 443, so it works on
      # any plan (Render blocks outbound SMTP ports on free web services). The
      # secret is set in the dashboard, or via Render's native Resend
      # integration, which populates RESEND_API_KEY for you.
      - key: RESEND_API_KEY
        sync: false
      # From: address - must be on the domain verified in Resend (T-4).
      - key: MAIL_DEFAULT_SENDER
        sync: false
      # Inbox that receives leads (C-7, still pending confirmation).
      - key: CONTACT_TO
        sync: false
      - key: CANONICAL_HOST
        value: washworkscws.com
      - key: LEGACY_HOSTS
        sync: false
      - key: NOINDEX
        value: "0"        # set to "1" on the staging service (O-1)
