# Render blueprint. Valid YAML this time, and authoritative - the env keys here
# match what app.py actually reads. Secrets are set in the Render dashboard, not
# committed (sync: false).
services:
  - type: web
    name: wash-works
    runtime: python
    plan: starter          # T-1: NOT free. The free tier sleeps after 15 min idle
                           # and wakes in ~50s, so the first buyer of the day waits.
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT; gunicorn must bind it or the health check never passes.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Mailgun HTTP API — the mail path notify() tries FIRST. Plain HTTPS on
      # port 443, so it works regardless of plan (unlike SMTP below, which
      # free web services cannot use at all - see the .env.example note).
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        value: mg.washworkscws.com
      - key: MAILGUN_API_BASE
        value: https://api.mailgun.net/v3
      # SMTP (Mailgun) — fallback path. Requires this service to be on a paid
      # plan; Render blocks outbound ports 25/465/587 on free web services.
      - key: MAIL_SERVER
        value: smtp.mailgun.org
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Shared by both mail paths.
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: CANONICAL_HOST
        value: washworkscws.com
      - key: LEGACY_HOSTS
        sync: false
      - key: NOINDEX
        value: "0"        # set to "1" on the staging service (O-1)
